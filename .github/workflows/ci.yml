name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # only used to commit a generated migration (see last step)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tasklog
          POSTGRES_PASSWORD: tasklog
          POSTGRES_DB: tasklog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tasklog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE: Host=localhost;Port=5432;Username=tasklog;Password=tasklog
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install, test, build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Backend — build
        run: dotnet build Tasklog.slnx -c Release

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version "10.0.*"

      # The very first run creates the initial migration, because it couldn't
      # be generated where the code was written. Later migrations are made
      # locally with "dotnet ef migrations add <Name>" and committed as usual.
      - name: Create the initial migration if there is none
        id: migration
        working-directory: backend/Tasklog.Api
        run: |
          if [ -d Migrations ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            dotnet ef migrations add InitialCreate --output-dir Migrations
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Migrations match the model
        working-directory: backend/Tasklog.Api
        run: dotnet ef migrations has-pending-model-changes

      - name: Backend — tests (real PostgreSQL)
        run: dotnet test Tasklog.slnx -c Release --logger "console;verbosity=normal"

      - name: Docker image builds
        run: docker build -t tasklog:ci .

      - name: Commit the generated migration
        if: steps.migration.outputs.created == 'true' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Tasklog.Api/Migrations
          git commit -m "Add InitialCreate EF Core migration (generated by CI)"
          git pull --rebase origin main
          git push origin HEAD:main
